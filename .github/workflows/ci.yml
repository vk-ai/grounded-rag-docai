name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr fonts-dejavu-core
      - run: pip install -e ".[dev,ocr]"
      - name: unit tests + OCR test + offline replay of recorded real runs
        run: pytest -q -rs
